name: Playwright E2E Tests - PBL TesYuk!

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pbl_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pbl_e2e
      DB_USERNAME: root
      DB_PASSWORD: root
      PBL_URL: http://localhost:8000
      E2E_EMAIL: ${{ secrets.E2E_EMAIL || 'tester1@gmail.com' }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'password123' }}

    steps:
      - name: Checkout E2E Test Repo
        uses: actions/checkout@v4
        with:
          path: e2e-tests

      - name: Checkout Aplikasi PBL (TesYuk!)
        uses: actions/checkout@v4
        with:
          repository: FattahulAlim/e2e-pmpl-pbl
          path: app

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql, gd, zip, bcmath
          coverage: none

      - name: Install Dependency Laravel
        working-directory: app
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env Laravel
        working-directory: app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Aset Frontend Laravel (Vite)
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Migrate dan Seed Database
        working-directory: app
        run: php artisan migrate:fresh --seed --force

      - name: Jalankan Server Laravel (Background)
        working-directory: app
        run: |
          nohup php artisan serve --port=8000 > /tmp/laravel.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000 >/dev/null; then
              echo "Laravel ready"
              break
            fi
            sleep 1
          done

      - name: Install Dependency Playwright
        working-directory: e2e-tests
        run: npm ci

      - name: Install Browser Playwright
        working-directory: e2e-tests
        run: npx playwright install --with-deps chromium

      - name: Jalankan Test E2E
        working-directory: e2e-tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright Report dan Trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e-tests/playwright-report/
            e2e-tests/test-results/
          retention-days: 14
